name: upstream-sync

# Reusable workflow: proposes the upstream default branch to the calling fork as a pull request.
# It never merges and never pushes to the base branch; the only ref it writes is
# upstream-sync/<date> (sync.sh refuses any other). See README.md for the checks and their limits.
on:
  workflow_call:
    inputs:
      upstream:
        description: owner/repo of the upstream repository
        type: string
        required: true
      branch:
        description: upstream branch (empty = the upstream's default branch)
        type: string
        default: ''
      base:
        description: fork branch the pull request targets
        type: string
        default: main
      plugin_paths:
        description: newline-separated paths scanned for capability changes
        type: string
        default: .
      hook_paths_file:
        description: file in the fork listing the hook-text paths (one glob per line)
        type: string
        default: tools/hook-text-paths.txt

permissions: {}

concurrency:
  group: upstream-sync-run-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # pushes upstream-sync/* only; main is never written
      pull-requests: write
    steps:
      # The scripts come from the same commit of this repository that the caller pinned.
      - name: Fetch the sync scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tools
          persist-credentials: false

      - name: Check out the fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base }}
          path: repo
          fetch-depth: 0

      - name: Propose upstream
        working-directory: repo
        env:
          UPSTREAM: ${{ inputs.upstream }}
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ inputs.base }}
          PLUGIN_PATHS: ${{ inputs.plugin_paths }}
          HOOK_PATHS_FILE: ${{ inputs.hook_paths_file }}
          GH_TOKEN: ${{ github.token }}
        run: bash ../tools/sync.sh
